# Development profile: use in-memory H2 so app can start without Postgres
spring.datasource.url=jdbc:h2:mem:cadastro;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
# optional: allow web console at /h2-console
spring.h2.console.path=/h2-console

# Avoid trying to connect to remote Postgres in dev
spring.datasource.initialization-mode=always
# Disable Mongo auto-configuration in the dev profile (no local Mongo required)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
